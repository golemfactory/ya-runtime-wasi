[package]
name = "ya-runtime-wasi-cli"
version = "0.4.1"
authors = ["Golem Factory <contact@golem.network>"]
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0"
description = "Yagna WASI runtime"

[[bin]]
name = "ya-runtime-wasi"
path = "src/main.rs"
doc = false

[package.metadata.deb]
assets = [
    ["target/release/ya-runtime-wasi", "usr/lib/yagna/plugins/", "755"],
    ["conf/ya-runtime-wasi.json", "usr/lib/yagna/plugins/", "644"]
]
depends = "libgcc1, libc6"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
env_logger.workspace = true
log.workspace = true
serde_json.workspace = true
ya-runtime-wasi = { path = "crates/api", version = "0.3" }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
anyhow.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"

[workspace]
members = ["crates/api"]
exclude = [
    "crates/api/integration-tests/rust-wasi-tutorial"
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
wasmparser = "0.252.0"
wasmtime = { version = "47.0.3", default-features = false, features = ["anyhow", "component-model", "cranelift"] }
wasmtime-wasi = { version = "47.0.3", features = ["p1", "p2"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
clap = "4.6.6"

[features]
default = []
sgx = ["ya-runtime-wasi/sgx", "log/release_max_level_error"]
integration-tests = ["ya-runtime-wasi/integration-tests"]
