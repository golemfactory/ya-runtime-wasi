name: Continuous integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - v[0-9]*

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu
          - macos
          - windows
    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true
    - name: Install tools
      uses: jdx/mise-action@v4
      with:
        version: 2026.7.5
        install_args: "rust protoc actionlint shellcheck"
    - name: GitHub Actions workflows
      if: matrix.os == 'ubuntu'
      run: mise run ci:workflows
    - name: Cargo fmt
      run: mise run ci:fmt
    - name: Cargo build
      run: mise run ci:build
    - name: Cargo test
      run: mise run ci:test
    - name: Cargo clippy
      if: matrix.os == 'ubuntu'
      run: mise run ci:clippy
